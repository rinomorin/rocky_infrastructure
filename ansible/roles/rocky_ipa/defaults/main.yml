# role/ipa_setup/defaults/main.yml
ipa_admin_password: "{{ lookup('env', 'ipa_admin_password') }}"
ipa_domain: "{{ lookup('env', 'ipa_domain')|lower }}"
ipa_realm: "{{ lookup('env', 'ipa_domain')|upper }}"
ipa_stat: "initial"
is_ipa_pkg: False
ipa_type: "{{ hostvars[inventory_hostname]['ipa_cluster_role'] | default('client') }}"
ipa_master_host: "{{ groups['ipa'][0] }}"
ipa_helper_host: "{{ groups['helpers'][0] }}"
ipa_master: "{{ hostvars[ipa_master_host]['inventory_hostname'] }}"
ipa_master_ip: "{{ hostvars[ipa_master_host]['ansible_host'] }}"
ipa_primary_fqdn: "{{ hostvars[ipa_master_host]['hostname'] }}"
ipa_role: "{{ ipa_type }}"
ipa_hostname: "{{ ansible_fqdn }}"
ipa_setup_dns: true
ipa_setup_ca: true       # Set false for replica unless promoting CA
ipa_mkhomedir: true
ipa_no_forwarders: true
ipa_no_ntp: true
ipa_no_hbac_allow: true
ipa_ca_intermediate: "{{ groups['ca_intermediate'][0] }}"
ipa_ca_intermediate_ip: "{{ hostvars[groups['ca_intermediate'][0]].ansible_host }}"
ipa_helper: "{{ groups['helpers'][0] }}"
ipa_helper_ip: "{{ hostvars[groups['helpers'][0]].ansible_host }}"
# Dynamically extracts the CIDRs from the kvm host inventory structure on the fly
trusted_subnets: "{{ hostvars[groups['kvm'][0]]['libvirt_networks'] | map(attribute='cidr') | list }}"

# Standard core system services required by the Identity & Mesh infrastructure
compliance_services:
  - http
  - https
  - dns
  - dns-over-tls
  - ldap
  - ldaps
  - kerberos
  - ssh
  - ntp

# Non-standard or auxiliary application ports requiring explicit transport mapping
compliance_custom_ports:
  - { port: "8443", proto: "tcp" } # Custom Management Dashboard UI
  - { port: "8080", proto: "tcp" } # Alternative Web Server / Reverse Proxy
  - { port: "3268", proto: "tcp" } # Active Directory / FreeIPA Global Catalog (Plain)
  - { port: "3269", proto: "tcp" } # Active Directory / FreeIPA Global Catalog (SSL)